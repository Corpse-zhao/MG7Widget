name: Build MG7Widget

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 安装工具
        run: |
          brew install make xz xcodegen ldid-procursus
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
          ln -sf "$(brew --prefix)/opt/ldid-procursus/bin/ldid" "$(brew --prefix)/bin/ldid"
          echo "ldid(procursus) at: $(command -v ldid)"
          # v0.4.16: ldid 与 ldid-procursus 是冲突 formula 不能共存(run#36实锤) -> 只装 procursus
          # procursus 版带 entitlements 内存修复 patch(#34/#14)，且 formula test 即 -S嵌/-e读全链验证

      # ---------- 1. Xcode 工程：(App + Widget Extension) ----------
      - name: 生成 Xcode 工程
        run: |
          cd ios/MG7Widget
          xcodegen generate

      - name: 编译 App + Widget
        run: |
          set -o pipefail
          cd ios/MG7Widget
          xcodebuild -project MG7Widget.xcodeproj \
            -scheme MG7Widget \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -40

      - name: 打 .tipa（TrollStore 安装包）
        run: |
          cd ios/MG7Widget
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::未找到编译产物 .app"; exit 1; fi
          echo "APP=$APP"
          du -sh "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          APPDIR="Payload/$(basename "$APP")"
          APPBIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPDIR/Info.plist")
          EXTDIR=$(find "$APPDIR/PlugIns" -maxdepth 1 -name '*.appex' | head -1)
          EXTBIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXTDIR/Info.plist")
          echo "产物: $APPDIR/$APPBIN + PlugIns/$(basename "$EXTDIR")/$EXTBIN"
          # v0.4.17: 嵌入环节移至本地交付（deliver_0417.py：本地 procursus ldid.exe 嵌入+守门+Release）。
          # CI 环境嵌入九轮实锤全部静默失败/剥离：saurik 版(run#29/30)、procursus release 下载不稳
          # (run#31/32)、codesign 剥离 com.apple.* 键(run#33/34/35)、brew procursus 亦无效(run#36/37)。
          # 而 procursus ldid 的 Windows 版对 CI 同源产物全矩阵实锤嵌入成功 —— 关键路径移出 CI。
          zip -qr MG7Widget.tipa Payload
          ls -lh MG7Widget.tipa
          test $(stat -f%z MG7Widget.tipa) -gt 100000 || { echo "::error::tipa 过小，打包异常"; exit 1; }

      # ---------- 2. Theos 工具：MGHelper ----------
      - name: 安装 roothide/theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          # roothide/theos 不带 iOS SDK，必须自行下载（否则报
          #   ==> Error: Your chosen SDK, "iPhoneOS16.5.sdk", does not appear to exist.）
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/" 2>/dev/null \
            || cp -R /tmp/sdks/iPhoneOS1*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: 编译 mghelper
        # 辅助工具，编不出来不阻断 .tipa 交付（.tipa 才是主线交付物）
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios/MGHelperTweak
          gmake package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 2>&1 | tail -30
          ls -lh packages/ || true

      # ---------- 3. 上传 ----------
      - name: 上传 .tipa
        uses: actions/upload-artifact@v4
        with:
          name: MG7Widget-tipa
          path: ios/MG7Widget/MG7Widget.tipa
          if-no-files-found: error

      - name: 上传 helper deb
        uses: actions/upload-artifact@v4
        with:
          name: mghelper-deb
          path: ios/MGHelperTweak/packages/*.deb
          if-no-files-found: warn
