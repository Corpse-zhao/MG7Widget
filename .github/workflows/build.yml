name: Build MG7Widget

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 安装工具
        run: |
          brew install make xz ldid xcodegen
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
          # v0.4.10: Homebrew saurik 版 ldid 2.1.5_1 的 -S<file> 嵌 entitlements 静默失败
          # (v0.4.8/v0.4.9 CI 守门两次实锤; 本地复现: 同输入同语法 procursus 版嵌入成功)
          # → 覆盖为 Procursus 构建 (TrollStore/theos 生态标配)
          curl -sL --retry 5 --retry-delay 2 --retry-all-errors -o /opt/homebrew/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          test $(stat -f%z /opt/homebrew/bin/ldid) -gt 100000 || { echo "::error::procursus ldid 下载异常(过小)"; exit 1; }
          chmod +x /opt/homebrew/bin/ldid
          echo "ldid replaced: $(which ldid)"

      # ---------- 1. Xcode 工程：(App + Widget Extension) ----------
      - name: 生成 Xcode 工程
        run: |
          cd ios/MG7Widget
          xcodegen generate

      - name: 编译 App + Widget
        run: |
          set -o pipefail
          cd ios/MG7Widget
          xcodebuild -project MG7Widget.xcodeproj \
            -scheme MG7Widget \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -40

      - name: 打 .tipa（TrollStore 安装包）
        run: |
          cd ios/MG7Widget
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::未找到编译产物 .app"; exit 1; fi
          echo "APP=$APP"
          du -sh "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # v0.4.7 关键修复：显式嵌入 entitlements。
          # CODE_SIGNING_ALLOWED=NO 构建出的二进制没有签名 blob（entitlements 根本没嵌），
          # TrollStore 重签时用默认 entitlements（无 no-sandbox）→ App 带沙盒跑 →
          # 扫不了小组件的 PluginKitExtension 容器 → v0.4.3~0.4.6「❌ 目录不可达(沙盒?)」根因。
          # ldid 嵌入的 entitlements 是 XML 明文，TrollStore 安装时会保留并 platformize。
          APPDIR="Payload/$(basename "$APP")"
          APPBIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPDIR/Info.plist")
          EXTDIR=$(find "$APPDIR/PlugIns" -maxdepth 1 -name '*.appex' | head -1)
          EXTBIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXTDIR/Info.plist")
          echo "ldid in use: $(which ldid)"
          ldid -S"$GITHUB_WORKSPACE/ios/MG7Widget/Resources/App.entitlements" "$APPDIR/$APPBIN"
          ldid -S"$GITHUB_WORKSPACE/ios/MG7Widget/Resources/Widget.entitlements" "$EXTDIR/$EXTBIN"
          echo "ldid 嵌入 entitlements: $APPDIR/$APPBIN + PlugIns/$(basename "$EXTDIR")/$EXTBIN"
          # v0.4.8 CI 内守门：ldid -S 退出 0 ≠ entitlements 真嵌入（连 application-groups key 都扫不到实锤过）。
          # ldid -e 读回 entitlements 明文，关键 key 必须 FOUND，否则 fail run 不出包。
          ldid -e "$APPDIR/$APPBIN" | grep -q no-sandbox || { echo "::error::主App no-sandbox 未嵌入(ldid -S静默失败?)"; exit 1; }
          ldid -e "$EXTDIR/$EXTBIN" | grep -q application-groups || { echo "::error::小组件 App Group 未嵌入"; exit 1; }
          echo "entitlements 验证通过: 主App no-sandbox + 小组件 application-groups 均嵌入"
          zip -qr MG7Widget.tipa Payload
          ls -lh MG7Widget.tipa
          test $(stat -f%z MG7Widget.tipa) -gt 100000 || { echo "::error::tipa 过小，打包异常"; exit 1; }

      # ---------- 2. Theos 工具：MGHelper ----------
      - name: 安装 roothide/theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          # roothide/theos 不带 iOS SDK，必须自行下载（否则报
          #   ==> Error: Your chosen SDK, "iPhoneOS16.5.sdk", does not appear to exist.）
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/" 2>/dev/null \
            || cp -R /tmp/sdks/iPhoneOS1*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: 编译 mghelper
        # 辅助工具，编不出来不阻断 .tipa 交付（.tipa 才是主线交付物）
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios/MGHelperTweak
          gmake package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 2>&1 | tail -30
          ls -lh packages/ || true

      # ---------- 3. 上传 ----------
      - name: 上传 .tipa
        uses: actions/upload-artifact@v4
        with:
          name: MG7Widget-tipa
          path: ios/MG7Widget/MG7Widget.tipa
          if-no-files-found: error

      - name: 上传 helper deb
        uses: actions/upload-artifact@v4
        with:
          name: mghelper-deb
          path: ios/MGHelperTweak/packages/*.deb
          if-no-files-found: warn
